<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .text { font-family: monospace; font-size: 24px; fill: #00ff9d; }
        .bg { fill: #0a0a0a; }
        .border { fill: none; stroke: #00ff9d; stroke-width: 4; }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 2px #00ff9d); }
            50% { filter: drop-shadow(0 0 8px #00ff9d); }
            100% { filter: drop-shadow(0 0 2px #00ff9d); }
        }
        .glow { animation: glow 2s infinite; }
    </style>
    
    <!-- 背景 -->
    <rect class="bg" x="0" y="0" width="200" height="200" rx="10"/>
    
    <!-- 边框 -->
    <rect class="border glow" x="10" y="10" width="180" height="180" rx="8"/>
    
    <!-- 文本 -->
    <text class="text glow" x="100" y="90" text-anchor="middle">BASE</text>
    <text class="text glow" x="100" y="130" text-anchor="middle">64</text>
</svg> 