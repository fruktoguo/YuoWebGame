<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="#f7f7fc" />
  
  <!-- 计算器外壳 -->
  <rect x="25" y="20" width="50" height="65" rx="10" ry="10" fill="#ffffff" 
        filter="drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1))" />
  
  <!-- 计算器屏幕 -->
  <rect x="30" y="25" width="40" height="18" rx="4" ry="4" fill="#f7f7fc" />
  
  <!-- 数字显示 -->
  <text x="65" y="39" fill="#4a4a68" font-family="monospace" font-size="14" text-anchor="end" font-weight="bold">0</text>
  
  <!-- 按钮 - 行1 -->
  <rect x="30" y="48" width="8" height="8" rx="2" ry="2" fill="#e9eafc" />
  <rect x="42" y="48" width="8" height="8" rx="2" ry="2" fill="#e9eafc" />
  <rect x="54" y="48" width="8" height="8" rx="2" ry="2" fill="#e9eafc" />
  <rect x="66" y="48" width="8" height="8" rx="2" ry="2" fill="#6979f8" />
  
  <!-- 按钮 - 行2 -->
  <rect x="30" y="60" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="42" y="60" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="54" y="60" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="66" y="60" width="8" height="8" rx="2" ry="2" fill="#6979f8" />
  
  <!-- 按钮 - 行3 -->
  <rect x="30" y="72" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="42" y="72" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="54" y="72" width="8" height="8" rx="2" ry="2" fill="#ffffff" />
  <rect x="66" y="72" width="8" height="8" rx="2" ry="2" fill="#ff88a9" />
</svg> 