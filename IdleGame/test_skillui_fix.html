<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillUI 初始化测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .info { color: blue; }
        #skills-page { width: 100%; height: 400px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>SkillUI 初始化测试</h1>
    <div id="test-results"></div>
    <div id="skills-page"></div>

    <!-- 按照正确顺序加载脚本 -->
    <script src="js/utils/Utils.js"></script>
    <script src="js/utils/Calculator.js"></script>
    <script src="js/utils/Storage.js"></script>
    <script src="js/data/texts.js"></script>
    <script src="js/data/classes.js"></script>
    <script src="js/data/skills.js"></script>
    <script src="js/data/equipment.js"></script>
    <script src="js/data/monsters.js"></script>
    <script src="js/core/Character.js"></script>
    <script src="js/core/Equipment.js"></script>
    <script src="js/core/Skills.js"></script>
    <script src="js/core/Combat.js"></script>
    <script src="js/core/Game.js"></script>
    <script src="js/ui/CharacterUI.js"></script>
    <script src="js/ui/CombatUI.js"></script>
    <script src="js/ui/EquipmentUI.js"></script>
    <script src="js/ui/SkillUI.js"></script>
    <script src="js/debug.js"></script>

    <script>
        function addTestResult(message, type = 'info') {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function runSkillUITest() {
            try {
                addTestResult('<h3>SkillUI 初始化测试</h3>');
                
                // 检查数据加载
                if (window.SkillTreeData) {
                    addTestResult('✓ window.SkillTreeData 已加载', 'success');
                } else {
                    addTestResult('✗ window.SkillTreeData 未加载', 'error');
                    return;
                }

                // 创建模拟游戏对象
                const mockGame = {
                    character: {
                        level: 1,
                        skillPoints: 5,
                        learnedSkills: {},
                        autoCastSkills: []
                    }
                };

                // 创建 Skills 实例
                const skillsSystem = new Skills(mockGame);
                addTestResult('✓ Skills 系统创建成功', 'success');

                // 创建 SkillUI 实例
                addTestResult('正在创建 SkillUI 实例...', 'info');
                const skillUI = new SkillUI(skillsSystem);
                
                // 等待初始化完成
                setTimeout(() => {
                    if (skillUI.dependencyGraph && skillUI.dependencyGraph.size > 0) {
                        addTestResult(`✓ SkillUI 初始化成功，依赖图包含 ${skillUI.dependencyGraph.size} 个节点`, 'success');
                        addTestResult('✓ 所有测试通过！SkillTreeData 引用问题已修复', 'success');
                    } else {
                        addTestResult('✗ SkillUI 初始化失败或依赖图为空', 'error');
                    }
                }, 1000);

            } catch (error) {
                addTestResult(`✗ 测试失败: ${error.message}`, 'error');
                console.error('测试错误:', error);
            }
        }

        // 页面加载完成后运行测试
        window.addEventListener('load', () => {
            setTimeout(runSkillUITest, 200); // 稍微延迟确保所有脚本都加载完成
        });
    </script>
</body>
</html>
