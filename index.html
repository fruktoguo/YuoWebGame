<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuoHira的Web应用集</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="container">
        <header>
            <div class="cyber-corner top-left"></div>
            <div class="cyber-corner top-right"></div>
            <div class="cyber-corner bottom-left"></div>
            <div class="cyber-corner bottom-right"></div>
            <h1 class="neon-title" data-text="我的Web应用集">YuoHira的Web应用集</h1>
            <p class="subtitle">探索有趣的Web应用</p>
        </header>

        <div class="app-grid">
            <!-- Base64 工具 -->
            <a href="base64/index.html" class="app-card">
                <div class="energy-ripple"></div>
                <div class="app-image" style="background-image: url('base64/logo.png')"></div>
                <div class="app-content">
                    <h2 class="app-title">Base64 编解码工具</h2>
                    <p class="app-description">快速、安全的在线 Base64 编码和解码转换工具。</p>
                    <div class="app-tags">
                        <span class="app-tag">工具</span>
                        <span class="app-tag">编码</span>
                        <span class="app-tag">安全</span>
                    </div>
                </div>
            </a>

            <!-- 生命游戏 -->
            <a href="life/index.html" class="app-card">
                <div class="energy-ripple"></div>
                <div class="app-image" style="background-image: url('life/logo.png')"></div>
                <div class="app-content">
                    <h2 class="app-title">生命游戏模拟器</h2>
                    <p class="app-description">探索康威生命游戏的奥秘，观察细胞的生死变化规律。</p>
                    <div class="app-tags">
                        <span class="app-tag">模拟</span>
                        <span class="app-tag">游戏</span>
                        <span class="app-tag">科学</span>
                    </div>
                </div>
            </a>

            <!-- 工作性价比计算器 -->
            <a href="BWork/BWork.html" class="app-card">
                <div class="energy-ripple"></div>
                <div class="app-image" style="background-image: url('BWork/logo.png')"></div>
                <div class="app-content">
                    <h2 class="app-title">工作性价比计算器</h2>
                    <p class="app-description">计算你的工作性价比，看看你的工作是否值得。</p>
                </div>
            </a>
            
            <!-- 高级科学计算器 -->
            <a href="calculator/index.html" class="app-card">
                <div class="energy-ripple"></div>
                <div class="app-image" style="background-image: url('calculator/logo.svg')"></div>
                <div class="app-content">
                    <h2 class="app-title">高级科学计算器</h2>
                    <p class="app-description">简洁优雅的科学计算工具，支持多种高级数学函数计算。</p>
                    <div class="app-tags">
                        <span class="app-tag">工具</span>
                        <span class="app-tag">数学</span>
                        <span class="app-tag">简约风格</span>
                    </div>
                </div>
            </a>

            <!-- 键盘华容道 -->
            <a href="keyboard-puzzle/index.html" class="app-card">
                <div class="energy-ripple"></div>
                <div class="app-image" style="background: linear-gradient(135deg, #333 0%, #555 50%, #333 100%); display: flex; align-items: center; justify-content: center; font-size: 3em; color: #0ff; text-shadow: 0 0 20px #0ff;">⌨️</div>
                <div class="app-content">
                    <h2 class="app-title">键盘华容道</h2>
                    <p class="app-description">挑战你的空间思维！在完整的104键键盘上体验华容道的乐趣。</p>
                    <div class="app-tags">
                        <span class="app-tag">益智</span>
                        <span class="app-tag">游戏</span>
                        <span class="app-tag">挑战</span>
                    </div>
                </div>
            </a>
        </div>
        <footer>
            <p>© 2024 我的Web应用集 | 持续更新中</p>
        </footer>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
